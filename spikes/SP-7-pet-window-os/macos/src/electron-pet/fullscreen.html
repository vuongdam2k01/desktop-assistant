<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SP7-Fullscreen-Simulation</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #181825;
      color: #cdd6f4;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      border: 6px solid #f38ba8;
    }
    h1 {
      font-size: 32px;
      color: #f38ba8;
      margin-bottom: 12px;
    }
    p {
      font-size: 18px;
      color: #a6adc8;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }
    .badge {
      background: #313244;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 24px;
      font-family: monospace;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>MÔ PHỎNG ỨNG DỤNG FULLSCREEN (E6)</h1>
  <p>Cửa sổ này đang chiếm toàn bộ màn hình để kiểm tra xem pet (always-on-top) có tiếp tục nổi lên trên hay bị đè lấp khi ứng dụng toàn màn hình được kích hoạt.</p>
  <div class="badge">WINDOW STATE: EXCLUSIVE / BORDERLESS FULLSCREEN</div>
</body>
</html>
