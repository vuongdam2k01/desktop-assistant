<!DOCTYPE html>
<html>
<head>
  <meta charset=\"UTF-8\">
  <title>SP18-Dialogue-Card-ArchA</title>
  <link rel=\"stylesheet\" href=\"style.css\">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .card-container {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 12px;
      padding: 14px 18px;
      color: #f8fafc;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class=\"card-container\">
    <div>
      <div class=\"card-title\">
        <span id=\"card-type\">APPROVAL REQUIRED</span>
        <span style=\"font-size: 10px; color: #94a3b8;\">#JOB-18</span>
      </div>
      <div class=\"card-body\" id=\"card-text\">
        Agent muốn xóa 3 task quá hạn trong Notion Task List.
      </div>
    </div>
    <div class=\"card-buttons\">
      <button class=\"btn btn-primary\" id=\"btn-approve\">Chấp thuận</button>
      <button class=\"btn btn-secondary\" id=\"btn-deny\">Từ chối</button>
    </div>
  </div>

  <script>
    if (window.api) {
      window.api.onCardShow((data) => {
        if (data.type) document.getElementById('card-type').textContent = data.type;
        if (data.text) document.getElementById('card-text').textContent = data.text;
      });
    }
  </script>
</body>
</html>
