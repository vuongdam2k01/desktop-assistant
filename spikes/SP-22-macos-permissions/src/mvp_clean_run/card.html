<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 14px;
      padding: 12px 14px;
      color: #f8fafc;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-content {
      font-size: 13px;
      line-height: 1.4;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .card-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card-box">
    <div class="card-header">
      <span>Tương tác MVP</span>
      <span class="card-badge">Zero-TCC Verified</span>
    </div>
    <div class="card-content" id="msg">
      Đang kiểm chứng luồng MVP: Pet Window, Speech Bubble, SQLite Ledger, SafeStorage, Connector Dispatch...
    </div>
  </div>
  <script>
    window.electronAPI && window.electronAPI.onUpdateMessage && window.electronAPI.onUpdateMessage((msg) => {
      document.getElementById('msg').innerText = msg;
    });
  </script>
</body>
</html>
