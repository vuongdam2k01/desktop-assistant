# Temporary: establishes whether an Intel macOS runner can still be requested.
# The platform capability promises macOS 13 or later, which includes Intel hardware,
# and nothing has ever compiled the x64 native module. Delete once answered.
name: Runner Probe

on:
  workflow_dispatch:

jobs:
  intel-macos:
    name: Intel macOS availability
    runs-on: macos-13
    timeout-minutes: 5
    steps:
      - name: Report the architecture this runner reports
        run: |
          uname -m
          sw_vers
