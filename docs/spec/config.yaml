# docs/spec/config.yaml — generated by specdocs:init; edit freely
schema: design

context: |
  Language: en — all artifacts are authored in English; structural headings of specs
  (Requirements, Scenario, ADDED/MODIFIED…) and keywords SHALL/MUST remain in English.
  Project: Desktop Assistant — a desktop work-assistant application driven by an AI agent system,
  whose primary touchpoint is a persistent animated pet on screen. The MVP pairs a desktop client
  holding all product logic (pet, agents, hooks, ledger, undo) with a peer backend service
  (Google Sign-In, connector OAuth broker, encrypted replication, update manifest). Data belongs to the
  account, not the device: jobs, ledger, rules, configuration and connector authorisation replicate to every
  signed-in device, so account sign-in alone restores everything ready to use and the user carries no secret,
  file or enrolled device between machines. Replicated data is encrypted at rest under service-managed keys,
  which means the privacy boundary is operational — confined key access, least privilege, audited — rather than
  cryptographic. Each device keeps a local working copy, so the product still functions offline. Scope of this repository is
  strictly specification and architectural modelling: spec, model, contracts and acceptance plans are the
  deliverables, implementation belongs to an external engineering workflow, and no application source code
  exists here.
  Stack: Electron + Rive pet window, React + TypeScript + Tailwind app window, pi agents SDK as the
  agent harness, local ledger store replicated to a server-side encrypted store, Node.js + Fastify +
  TypeScript + PostgreSQL backend.
  Constitution: docs/spec/constitution.md — strictly obeyed by all artifacts.
  Evidence: spikes/SP-*/REPORT.md and the raw logs they cite under spikes/SP-*/evidence/.
  Upstream requirements: none — this project declares no upstream traceability anchor.
  docs/raw-idea/prd-mvp.md and docs/raw-idea/idea-brief.md are background material that artifacts
  may read and quote, but specs record no upstream Refs against them.

rules:
  proposal:
    - If touching constitutional principles → warn on the first line
  specs:
    - Observable invariants authored as requirements
  model:
    - No library/class names; variability points marked closed/open/reserved
  contracts:
    - Must specify version, status, owner, consumers; other domains reference only through here
  design:
    - Every Decision must evaluate alternatives; constitutional violations logged in Complexity Tracking
  verification:
    - Thresholds must cite verified sources or be explicitly tagged as unverified
    - Acceptance criteria describe observable behaviour; never build, install or test-runner steps

operations:
  archive:
    guidance:
      - Run specdocs:sync for model/design/contracts/evolution prior to archive
      - Run specdocs:analyze; do not archive while CRITICAL issues remain

# specdocs-specific block — read by skills and spec-check.mjs
specdocs:
  upstream:
    file: ""                 # no upstream traceability anchor for this project
    id_prefixes: []
    must_pattern: ""
  evidence_dirs:
    - spikes/
  evidence_sections: "^(2|3|4|5)\\."   # regex for level 2–3 headings treated as MANDATORY to cite
  evidence_files: "REPORT\\.md$"       # only spike REPORT.md files count as citable evidence
  domains:
    - pet
    - agent
    - job
    - connector
    - approval
    - ledger
    - undo
    - app
    - backend
    - uix
    - platform
    - sync
  clusters:
    - name: trust-chain
      capabilities: [ledger, undo, approval]
      constraint: Shared append-only ledger; a ledger write is a precondition of every tool call (fail-closed).
    - name: agent-runtime
      capabilities: [pet, agent, job]
      constraint: Shared pi agents SDK harness and job lifecycle states.
    - name: desktop-shell
      capabilities: [pet, app, uix]
      constraint: Shared always-on-top window stack, focus handling and notification surface.
    - name: integration
      capabilities: [connector, backend, sync]
      constraint: Shared OAuth broker flow; connector authorisation is account-owned and replicates encrypted.
    - name: account-sync
      capabilities: [sync, ledger, backend, platform]
      constraint: >-
        Shared replication envelope and service-managed key custody. Every store that replicates must define its
        conflict resolution, and every path that can decrypt must be least-privileged and audited.
  crosscutting:
    - startup/shutdown
    # Items carrying `terms` are topics this project words differently in its requirements; the terms name the
    # wording that actually appears, so the check measures coverage rather than vocabulary.
    - name: crash recovery
      terms: [crash, rebuilt after a restart, interrupted work]
    - name: schema migration
      # Known narrow coverage: only `connector` requires a stored artifact's schema version to be honoured
      # (a manifest written for a later schema version is refused). The ledger store schema, the rule catalogue
      # and the replicated store descriptor state their version policy in contracts only, with no requirement
      # yet. Closing that needs a decision-maker, not a vocabulary entry — see the audit report of 2026-09-13.
      terms: [schema version]
    - name: network loss
      terms: [backend disruption, offline queue, could not be reached]
    - name: quota exhaustion
      terms: [quota, rate limit]
    - multi-display/resolution
    - IME/input method
    - timezone/clock skew
    - OS paths/permissions
    - uninstall/data wipe
    - name: first-run
      terms: [onboarding]
    - log rotation/retention
    - name: connector token revocation
      terms: [revoked, revocation, revokes]
    - name: approval mode change mid-job
      terms: [mode change]
    - offline queue / ask_user timeout
    - name: multi-device concurrent edit and sync conflict
      terms: [conflict-resolution, conflicting mutable record]
    - name: account recovery on a replacement device
      terms: [sign-in alone, new device]
    - name: device revocation and sign-out
      terms: [revocable, signed-out]
    - name: key custody access and audit
      terms: [key access]
  guides_dir: docs/guides/   # destination directory for external extension guides
